app:
  version: @project.version@
  jwt:
    access-token-ttl-ms: 900_000        #15 minutes
    refresh-token-ttl-ms: 2_419_200_000 #4 weeks
    iss: https://my-auth-service/
    key-id: key-1
    keys:
      private-key-path: classpath:keys/private.pem
      public-key-path: classpath:keys/public.pem